<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F5BEA">
<title>مكتبة المشروع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6FA;--sf:#fff;--tx:#0F1B2E;--mu:#5E6B82;--ln:#E3E8F0;--pr:#2F5BEA;--prs:#E8EEFF;--dg:#D23B3B;--sh:0 1px 2px rgba(15,27,46,.06),0 10px 28px -14px rgba(15,27,46,.22)}
@media(prefers-color-scheme:dark){:root{--bg:#0B1424;--sf:#121E34;--tx:#E8EEF8;--mu:#8FA0BC;--ln:#223253;--pr:#7497FF;--prs:#1B2A52;--dg:#F07272;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.55 "IBM Plex Sans Arabic",Tahoma,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px;border-radius:8px}
.app{display:grid;grid-template-columns:272px 1fr;min-height:100vh}
aside{background:var(--sf);border-inline-end:1px solid var(--ln);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px}
.orb{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#D6E4FF 0,#5B88FF 34%,#2340B8 68%,#16257A 100%);box-shadow:0 0 0 4px var(--prs),0 0 22px #3F73FF66}
.brand b{display:block;font-weight:600;font-size:16px;line-height:1.2}.brand small{color:var(--mu);font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;font-weight:500;border:1px solid var(--ln);background:var(--sf)}
.btn.pr{background:var(--pr);border-color:var(--pr);color:#fff}.btn.dg{background:var(--dg);border-color:var(--dg);color:#fff}
.add{display:grid;gap:8px}
.lab{display:flex;align-items:center;justify-content:space-between;color:var(--mu);font-size:13px;padding:0 8px}
.ib{width:36px;height:36px;border-radius:10px;display:inline-grid;place-items:center;color:var(--mu)}.ib:hover{background:var(--bg);color:var(--tx)}
#fl{display:grid;gap:2px}
.f{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 10px;border-radius:10px;width:100%;text-align:start}
.f:hover{background:var(--bg)}.f.on{background:var(--prs);font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.f .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.f .c{color:var(--mu);font-size:13px}
#who{margin-top:auto}
.in{min-height:44px;border:1px solid var(--ln);background:var(--sf);border-radius:12px;padding:0 12px;width:100%}
main{padding:28px clamp(16px,3vw,40px) 120px;min-width:0;max-width:1180px;width:100%}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:18px}
h1{margin:0;font-size:26px;font-weight:600;line-height:1.3}.cn{color:var(--mu);font-size:14px;margin-inline-start:4px}
.tb{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.sr{position:relative;flex:1;min-width:200px}.sr>svg{position:absolute;inset-inline-start:12px;top:12px;color:var(--mu)}.sr .in{padding-inline-start:40px}
.chips{display:flex;gap:6px}.chip{min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--ln);background:var(--sf);font-size:14px}.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
select.in{width:auto;min-height:40px}
.seg{display:flex;border:1px solid var(--ln);border-radius:10px;overflow:hidden;background:var(--sf)}.seg button{width:40px;height:38px;display:grid;place-items:center;color:var(--mu)}.seg .on{background:var(--prs);color:var(--pr)}
#ls{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;overflow:hidden;box-shadow:var(--sh);position:relative;display:flex;flex-direction:column}
.th{height:124px;display:grid;place-items:center;position:relative;overflow:hidden;color:#fff;text-decoration:none}
.th img{width:100%;height:100%;object-fit:cover}.th svg{width:34px;height:34px}.th .ext{position:absolute;bottom:10px;inset-inline-start:12px;font-size:12px;font-weight:600;letter-spacing:.3px;background:#0000002e;padding:1px 8px;border-radius:99px}
.th .big{font-size:42px;font-weight:600;opacity:.95}
.bd{padding:12px 14px 14px}.ti{font-weight:600;color:var(--tx);text-decoration:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}.ti:hover{color:var(--pr)}
.mt{color:var(--mu);font-size:13px;margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kb{position:absolute;top:8px;inset-inline-end:8px;background:var(--sf);color:var(--tx);box-shadow:var(--sh);width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
#ls.list{grid-template-columns:1fr;gap:10px}
.list .card{flex-direction:row;align-items:center;box-shadow:none}.list .th{width:68px;height:68px;flex:none;margin:8px;border-radius:12px}.list .th svg{width:26px;height:26px}.list .th .ext,.list .th .big{display:none}
.list .bd{flex:1;min-width:0;padding:8px 8px 8px 0}.list .kb{position:relative;box-shadow:none;margin-inline-end:10px;flex:none}
.empty{grid-column:1/-1;border:2px dashed var(--ln);border-radius:20px;padding:56px 20px;text-align:center;color:var(--mu)}
.empty b{display:block;color:var(--tx);font-size:18px;margin-bottom:6px}.empty .btn{margin-top:16px}
.sk{height:200px;border-radius:16px;background:var(--ln);animation:pl 1.2s ease-in-out infinite}@keyframes pl{50%{opacity:.45}}
#pop{position:fixed;z-index:30;min-width:190px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;box-shadow:0 18px 50px -12px rgba(0,0,0,.35);padding:6px;display:none}
#pop button{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:0 12px;border-radius:9px;text-align:start}#pop button:hover{background:var(--bg)}#pop .dg{color:var(--dg)}
#m{position:fixed;inset:0;background:#050a1488;display:flex;align-items:center;justify-content:center;padding:16px;z-index:40;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s}#m.on{opacity:1;visibility:visible}
.box{transform:translateY(18px) scale(.96);transition:transform .4s cubic-bezier(.2,.9,.3,1.15);background:var(--sf);border-radius:20px;padding:22px;width:100%;max-width:440px;display:grid;gap:12px;box-shadow:0 30px 80px -20px #000a}.box h2{margin:0;font-size:18px}.box p{margin:0;color:var(--mu)}.row{display:flex;gap:8px}.row .btn{flex:1}
#ov{position:fixed;inset:12px;z-index:35;border:3px dashed var(--pr);border-radius:24px;background:color-mix(in srgb,var(--pr) 14%,transparent);display:none;place-items:center;text-align:center;font-size:20px;font-weight:600;pointer-events:none}#ov.on{display:grid}
#tray{position:fixed;bottom:16px;inset-inline-start:16px;width:min(340px,calc(100% - 32px));display:grid;gap:8px;z-index:25}
.up{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:10px 14px;box-shadow:var(--sh);font-size:14px}.up .r{display:flex;justify-content:space-between;gap:10px}.up .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.up .bar{height:5px;border-radius:9px;background:var(--ln);margin-top:8px;overflow:hidden}.up .bar i{display:block;height:100%;background:var(--pr);transition:width .2s}.up.er .bar i{background:var(--dg)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:12px;display:none;z-index:50;max-width:calc(100% - 32px)}#toast.er{background:var(--dg);color:#fff}
.fab{display:none}
@media(max-width:820px){
.app{grid-template-columns:1fr}
aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:14px 12px 8px;gap:10px;border-inline-end:0;border-bottom:1px solid var(--ln)}
.add,.lab{display:none}
#fl{order:3;width:100%;display:flex;overflow-x:auto;gap:6px;padding-bottom:6px}.f{width:auto;flex:none;border:1px solid var(--ln);min-height:38px;border-radius:99px}
main{padding-top:18px}h1{font-size:22px}
.fab{display:grid;place-items:center;position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-end:20px;width:58px;height:58px;border-radius:50%;background:var(--pr);color:#fff;box-shadow:0 12px 30px -8px #2F5BEAaa;z-index:20}.fab svg{width:26px;height:26px}
#tray{bottom:92px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.tgs{display:flex;flex-wrap:wrap;gap:6px}
.tg{--c:#2F6BFF;display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:0 10px;border-radius:99px;font-size:12.5px;font-weight:500;background:color-mix(in srgb,var(--c) 14%,var(--sf));color:color-mix(in srgb,var(--c) 72%,var(--tx));border:1px solid color-mix(in srgb,var(--c) 30%,transparent);white-space:nowrap}
.tg::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
button.tg:hover,.tg.on{background:var(--c);color:#fff;border-color:var(--c)}.tg.on::before{background:#fff}
.tg button{width:18px;height:18px;border-radius:50%;line-height:1;font-size:15px;color:inherit}.tg button:hover{background:#0002}
.tg.ai{--c:#7A4DFF;animation:pl 1.2s ease-in-out infinite}
.card .tgs{margin-top:10px}
.sr{position:relative}#sg{position:absolute;top:46px;inset-inline:0;background:var(--sf);border:1px solid var(--ln);border-radius:14px;box-shadow:0 18px 50px -12px rgba(0,0,0,.35);padding:6px;z-index:15;display:none}
#sg .h{display:flex;align-items:center;min-height:40px;padding:0 10px;border-radius:9px;gap:8px;width:100%;text-align:start}#sg .h:hover,#sg .h.a{background:var(--bg)}#sg .h span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#sg .h svg{width:16px;height:16px;color:var(--mu)}
#sg .t{padding:6px 10px;color:var(--mu);font-size:12.5px;display:flex;justify-content:space-between;align-items:center}#sg .t button{color:var(--pr);font-size:12.5px}#sg .tgs{padding:4px 8px 8px}
.fb{position:relative}.fb .bg{position:absolute;top:-6px;inset-inline-start:-6px;min-width:20px;height:20px;border-radius:99px;background:var(--pr);color:#fff;font-size:12px;display:grid;place-items:center;padding:0 5px}
.act{display:flex;gap:6px;flex-wrap:wrap;margin:-6px 0 16px;align-items:center}.act:empty{display:none}.act .clr{color:var(--pr);font-size:13px;padding:0 6px}
.grp{display:grid;gap:8px;margin-top:6px}.grp h3{margin:0;font-size:13px;color:var(--mu);font-weight:500}
.box.lg{max-width:560px;max-height:88vh;overflow:auto}
.sug{display:grid;gap:2px;margin-top:-4px}.sug button{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border-radius:9px;text-align:start}.sug button:hover,.sug button.a{background:var(--bg)}.sug small{color:var(--mu);margin-inline-start:auto}
.who{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:13px;padding:0 8px;min-height:40px;border-radius:10px;width:100%;text-align:start}.who:hover{background:var(--bg)}.who b{color:var(--tx);font-weight:500}
@media(max-width:820px){.who{width:auto;margin-inline-start:auto;order:2}}

/* ---- button motion (transform/opacity only, compositor-friendly) ---- */
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn,.chip,.ib,.f,.seg button,button.tg{position:relative;overflow:hidden}
.fab,.kb{overflow:hidden}
.btn{isolation:isolate;transition:transform .15s,color .3s;--lq:var(--prs)}
.btn.pr{--lq:#1E3FB5}.btn.dg{--lq:#A52A2A}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--lq);transform:translateY(102%);border-radius:50% 50% 0 0/45% 45% 0 0;transition:transform .45s cubic-bezier(.2,.8,.2,1),border-radius .45s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.6;pointer-events:none}
.btn svg{transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.chip,.f,.ib,.seg button,button.tg{transition:transform .15s,background .2s,color .2s}
.chip:active,.f:active,.seg button:active,button.tg:active{transform:scale(.95)}.ib:active{transform:scale(.88)}
.fab{transition:transform .2s cubic-bezier(.3,1.4,.5,1)}.fab:active{transform:scale(.92)}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
@media(hover:hover){
.btn:hover::before{transform:translateY(0);border-radius:0}
.btn:hover svg{transform:scale(1.15) rotate(-6deg)}
button.tg:hover{transform:translateY(-1px)}
.fab:hover{transform:scale(1.07)}
.ib:hover{transform:scale(1.08)}}

#m.on .box{transform:none}
@keyframes pin{from{opacity:0;transform:translateY(-6px) scale(.96)}}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
@keyframes fin{from{opacity:0}}
#pop,#sg{animation:pin .22s cubic-bezier(.2,.9,.3,1.1)}
#toast{animation:tin .3s ease-out}.up{animation:tin .3s ease-out}#ov.on{animation:fin .25s}
#ls.sw>*{animation:tin .35s ease-out both}
.chip,.f,.ib,.seg button,button.tg{transition:transform .15s,background .35s ease,color .35s ease,border-color .35s ease}
#lang{margin-top:-10px}
@media(max-width:820px){#lang{width:auto;order:2;margin:0}}

.th.im{height:auto;min-height:110px;background:var(--bg)}
.th.im img{display:block;width:100%;height:auto;max-height:260px;object-fit:contain}
.th.pv{height:150px}
.th.pv .pvi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.th .ext{z-index:1}
.list .th.im,.list .th.pv{height:68px;min-height:0}.list .th.im img{height:100%;object-fit:cover}
.card .tgs{gap:5px}

#cbub{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-end:20px;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#7A4DFF,#2F5BEA);color:#fff;display:grid;place-items:center;box-shadow:0 12px 30px -8px #5B3FE0aa;z-index:22;overflow:hidden;transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
#cbub svg{width:26px;height:26px}#cbub:active{transform:scale(.92)}
@media(hover:hover){#cbub:hover{transform:scale(1.07)}}
#cpanel{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom,0px));inset-inline-end:20px;width:390px;height:min(580px,calc(100vh - 120px));background:var(--sf);border:1px solid var(--ln);border-radius:22px;box-shadow:0 30px 80px -20px #0008;z-index:28;display:none;flex-direction:column;overflow:hidden;transform-origin:bottom}
#cpanel.on{display:flex;animation:pin .28s cubic-bezier(.2,.9,.3,1.1)}
#chead{display:flex;align-items:center;gap:4px;padding:12px 14px;border-bottom:1px solid var(--ln);font-weight:600}
#cmsgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.bu{align-self:flex-end;background:var(--pr);color:#fff;padding:9px 13px;border-radius:16px;max-width:85%;word-break:break-word}
.ba{align-self:flex-start;background:var(--bg);padding:10px 13px;border-radius:16px;max-width:94%;word-break:break-word}.ba.er{color:var(--dg)}
.ri{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--ln);border-radius:12px;background:var(--sf);color:var(--tx);text-decoration:none;margin-top:6px}.ri:hover{border-color:var(--pr)}
.ri .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}.ri small{color:var(--mu);white-space:nowrap}
.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--mu);animation:pl 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
#csug{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 8px}#csug:empty{display:none}
.cin{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--ln)}
@media(max-width:820px){#cbub{inset-inline-end:auto;inset-inline-start:20px}#cpanel{inset-inline:0;bottom:0;width:auto;height:86vh;border-radius:22px 22px 0 0}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><span class="orb"></span><div><b data-tx="title"></b><small>Flame in Freefall</small></div></div>
  <div class="add"><button class="btn pr" id="bUp"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg><span data-tx="upload"></span></button><button class="btn" id="bLk"><svg viewBox="0 0 24 24"><path d="M10 14a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1M14 10a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1"/></svg><span data-tx="addlink"></span></button></div>
  <div><div class="lab"><span data-tx="folders"></span><button class="ib" id="bNf" data-al="newfolder"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div><div id="fl"></div></div>
  <button class="who" id="who" data-al="chname"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg><span><span data-tx="you"></span> <b id="wn"></b></span></button>
  <button class="who" id="lang" aria-label="Language"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg><span id="ln"></span></button>
</aside>
<main>
  <div class="hd"><h1 id="h1"></h1><span class="cn" id="cn"></span><span style="flex:1"></span><button class="ib" id="fm" data-al="folder_opts"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button></div>
  <div class="tb">
    <div class="sr"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input class="in" id="q" data-ph="search_ph" type="search" autocomplete="off"><div id="sg"></div></div>
    <button class="btn fb" id="bFl"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg><span data-tx="filter"></span><span class="bg" id="fbg" hidden></span></button><div class="chips" id="chips"><button class="chip" data-c="all" data-tx="all"></button><button class="chip" data-c="file" data-tx="files"></button><button class="chip" data-c="img" data-tx="images"></button><button class="chip" data-c="link" data-tx="links"></button></div>
    <select class="in" id="so" data-al="sort"><option value="new" data-tx="newest"></option><option value="old" data-tx="oldest"></option><option value="name" data-tx="byname"></option></select>
    <div class="seg"><button id="vg" class="on" data-al="grid"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button><button id="vl" data-al="listv"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div>
  </div>
  <div class="act" id="act"></div>
  <div id="ls"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
</main>
</div>
<button class="fab" id="fab" data-al="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<input id="fi" type="file" multiple hidden>
<button id="cbub" aria-label="Assistant"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/><path d="M9 11h6M9 14h4"/></svg></button>
<section id="cpanel" aria-label="Assistant"><header id="chead"><b data-tx="chat_title"></b><span style="flex:1"></span><button class="ib" id="cnew" data-al="chat_new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><button class="ib" id="cclose" data-al="chat_close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header><div id="cmsgs"></div><div class="cin"><input class="in" id="cinp" data-ph="chat_ph" autocomplete="off"><button class="btn pr" id="csend" data-tx="chat_send"></button></div></section>
<div id="pop"></div><div id="m"><div class="box" id="mb"></div></div><div id="ov"></div><div id="tray"></div><div id="toast"></div>
<script>
const $=id=>document.getElementById(id);

function allTags(){const m=new Map();for(const i of items)for(const t of i.tags||[]){const k=t.n.toLowerCase(),e=m.get(k);e?e.c++:m.set(k,{n:t.n,g:t.g,c:1})}
  for(const t of V){const k=t.n.toLowerCase();if(!m.has(k))m.set(k,{n:t.n,g:t.g,c:0})}return m}

const dom=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}};
function kind(i){if(i.type==='link')return{k:'link',c:'#2F6BFF'};const t=(i.contentType||'').toLowerCase(),n=(i.title||'').toLowerCase();
  if(t.includes('pdf')||n.endsWith('.pdf'))return{k:'file',c:'#E5484D',x:'PDF'};if(t.startsWith('image/'))return{k:'img',c:'#7A4DFF'};
  if(/sheet|csv|excel/.test(t)||/\.(xlsx?|csv)$/.test(n))return{k:'sheet',c:'#12A57A',x:tx('sheet')};
  const m=n.match(/\.([a-z0-9]{1,5})$/);return{k:'file',c:'#5E6B82',x:m?m[1].toUpperCase():tx('file')}}

function openBox(html,lg){busy++;const b=$('mb'),m=$('m');b.className='box'+(lg?' lg':'');b.innerHTML=html;m.classList.add('on');let d=false;
  const close=()=>{if(d)return;d=true;busy--;m.classList.remove('on');m._c=null;m._req=false};m._c=close;m._req=false;return close}
$('m').onmousedown=e=>{const m=$('m');if(e.target===m&&m._c&&!m._req)m._c()};
addEventListener('keydown',e=>{const m=$('m');if(e.key==='Escape'&&m._c&&!m._req)m._c()});
function ask(title,o={}){return new Promise(res=>{
  const close=openBox(`<h2>${esc(title)}</h2>${o.text?`<p>${esc(o.text)}</p>`:''}`+(o.fields||[]).map((f,i)=>f.opts?`<select class="in" data-i="${i}" aria-label="${esc(f.ph||'')}">${f.opts.map(x=>`<option value="${esc(x[0])}" ${x[0]===f.v?'selected':''}>${esc(x[1])}</option>`).join('')}</select>`:`<input class="in" data-i="${i}" placeholder="${esc(f.ph||'')}" value="${esc(f.v||'')}">`).join('')+`<div class="row"><button class="btn ${o.danger?'dg':'pr'}" id="ok">${o.ok||tx('save')}</button>${o.req?'':'<button class="btn" id="no">'+tx('cancel')+'</button>'}</div>`);
  const b=$('mb'),m=$('m'),ins=[...b.querySelectorAll('[data-i]')];(ins[0]||$('ok')).focus();m._req=!!o.req;
  const done=v=>{close();res(v)};m._c=()=>done(null);
  $('ok').onclick=()=>done(ins.map(x=>x.value.trim()));if($('no'))$('no').onclick=()=>done(null);
  b.onkeydown=e=>{if(e.key==='Enter'&&e.target.tagName!=='BUTTON')$('ok').click()}})}
const fopts=()=>[['',tx('nofolder')],...folders.map(f=>[f.id,f.name])];
function pop(anchor,list){const p=$('pop');p.innerHTML=list.map((x,i)=>`<button data-p="${i}" class="${x.dg?'dg':''}">${svg(x.i)}${x.t}</button>`).join('');p.style.display='block';
  const r=anchor.getBoundingClientRect(),w=p.offsetWidth,h=p.offsetHeight;p.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+'px';p.style.top=(r.bottom+6+h>innerHeight?Math.max(8,r.top-h-6):r.bottom+6)+'px';p._l=list}
const closePop=()=>$('pop').style.display='none';

const tagPill=(t,cls='')=>`<button class="tg ${cls}" style="--c:${tc(t.n)}" data-t="${esc(t.n)}">${esc(t.n)}</button>`;
function match(i){
  if(aiSet&&!aiSet.has(i.id))return false;
  if(cur!=='all'&&(i.folder||'')!==cur)return false;
  if(flt!=='all'&&!(flt==='link'?i.type==='link':flt==='img'?kind(i).k==='img':i.type==='file'&&kind(i).k!=='img'))return false;
  if(wsel&&i.by!==wsel)return false;
  if(sel.size){const s=new Set((i.tags||[]).map(t=>t.n.toLowerCase())),a=[...sel];if(!(mode==='all'?a.every(x=>s.has(x)):a.some(x=>s.has(x))))return false}
  if(q&&!((i.title||'')+' '+(i.url||'')+' '+(i.by||'')+' '+(i.tags||[]).map(t=>t.n).join(' ')).toLowerCase().includes(q.toLowerCase()))return false;
  return true}
function render(){
  const cnt=id=>items.filter(i=>(i.folder||'')===id).length;
  const row=(id,n,c,col)=>`<button class="f ${cur===id?'on':''}" data-f="${esc(id)}"><span class="dot" style="background:${col}"></span><span class="n">${esc(n)}</span><span class="c">${c}</span></button>`;
  const fl=[['all',tx('all'),items.length,'var(--mu)'],['',tx('nofolder'),cnt(''),'var(--ln)'],...folders.map(f=>[f.id,f.name,cnt(f.id),fc(f.id)])],sig=JSON.stringify(fl);
  if($('fl')._s!==sig){$('fl')._s=sig;$('fl').innerHTML=fl.map(x=>row(x[0],x[1],x[2],x[3])).join('')}
  $('fl').querySelectorAll('.f').forEach(b=>b.classList.toggle('on',b.dataset.f===cur));
  const fo=folders.find(f=>f.id===cur);$('h1').textContent=cur==='all'?tx('all_items'):cur===''?tx('nofolder'):(fo?fo.name:'');
  $('chips').querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b.dataset.c===flt));
  const nf=sel.size+(wsel?1:0);$('fbg').hidden=!nf;$('fbg').textContent=nf;
  const names=new Map([...allTags()].map(([k,v])=>[k,v.n]));
  $('act').innerHTML=nf||aiSet||flt!=='all'?[...sel].map(k=>`<button class="tg on" style="--c:${tc(k)}" data-t="${esc(names.get(k)||k)}">${esc(names.get(k)||k)} ×</button>`).join('')+(wsel?`<button class="tg on" data-w="">${tx('from',{n:esc(wsel)})}</button>`:'')+(aiSet?`<button class="tg on" style="--c:#7A4DFF" data-ai0>${tx('chat_res',{n:aiSet.size})}</button>`:'')+`<button class="clr" data-clr>${tx('clear_all')}</button>`:'';
  let l=items.filter(match);
  l.sort(sort==='name'?(a,b)=>(a.title||'').localeCompare(b.title||'','ar'):sort==='old'?(a,b)=>a.at-b.at:(a,b)=>b.at-a.at);
  $('cn').textContent=l.length?tx('n_items',{n:l.length}):'';$('ls').className=view==='list'?'list':'';
  const filtered=q||flt!=='all'||nf||aiSet;
  $('ls').innerHTML=l.length?l.map(i=>{const k=kind(i),href=i.type==='link'?i.url:i.fileUrl,f=folders.find(x=>x.id===i.folder),tg=i.tags||[];
    const pv=i.thumb||'',full=k.k==='img',fb=i.type==='link'?`<span class="big">${esc(dom(i.url).charAt(0).toUpperCase())}</span>`:svg(k.k);const th=full?`<img src="${esc(href)}" alt="" loading="lazy" decoding="async">`:fb+(pv?`<img class="pvi" src="${esc(pv)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">`:'');

let pdfP;function loadPdf(){return pdfP||(pdfP=new Promise((ok,no)=>{const e=document.createElement('script');e.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';e.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';ok(window.pdfjsLib)};e.onerror=()=>{pdfP=null;no(new Error('pdf.js'))};document.head.appendChild(e)}))}

const tray=[];function drawTray(){$('tray').innerHTML=tray.map(u=>`<div class="up ${u.er?'er':''}"><div class="r"><span class="nm">${esc(u.name)}</span><span>${u.er?tx('failed'):u.pct>=100?tx('done'):u.pct+'%'}</span></div>${u.er?`<div style="color:var(--dg);font-size:13px;margin-top:4px">${esc(u.er)}</div>`:''}<div class="bar"><i style="width:${u.pct}%"></i></div></div>`).join('')}
function xhr(f,u){return new Promise((ok,no)=>{const x=new XMLHttpRequest();x.open('POST','/api/upload?name='+encodeURIComponent(f.name)+'&type='+encodeURIComponent(f.type||'application/octet-stream'));x.setRequestHeader('Content-Type','application/octet-stream');
  x.upload.onprogress=e=>{if(e.lengthComputable){u.pct=Math.min(99,Math.round(e.loaded/e.total*100));drawTray()}};
  x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch(e){}x.status<300&&j.url?ok(j.url):no(new Error(j.error||(x.status===413?tx('too_big'):'HTTP '+x.status)))};x.onerror=()=>no(new Error(tx('lost')));x.send(f)})}

      const j=await api({action:'addFile',fileUrl:url,title:f.name,size:f.size,contentType:f.type,folder:dest,by:by(),thumb});ids.push(j.id);u.pct=100;drawTray();setTimeout(()=>{tray.splice(tray.indexOf(u),1);drawTray()},1800)}

Object.assign(D,{"chat_title": {"ar": "مساعد المكتبة", "en": "Library assistant"}, "chat_ph": {"ar": "اسأل عن ملفاتك وروابطك...", "en": "Ask about your files and links..."}, "chat_send": {"ar": "إرسال", "en": "Send"}, "chat_new": {"ar": "محادثة جديدة", "en": "New chat"}, "chat_close": {"ar": "إغلاق", "en": "Close"}, "chat_fail": {"ar": "تعذّر الرد", "en": "Could not answer"}, "chat_show": {"ar": "عرض النتائج في المكتبة ({n})", "en": "Show results in the library ({n})"}, "chat_res": {"ar": "نتائج المساعد ({n}) ×", "en": "Assistant results ({n}) ×"}, "chat_s1": {"ar": "أين أجد ملفات CO2؟", "en": "Where are the CO2 files?"}, "chat_s2": {"ar": "اعرض كل الروابط", "en": "Show all links"}, "chat_s3": {"ar": "ماذا أُضيف مؤخراً؟", "en": "What was added recently?"}, "chat_hello": {"ar": "أنا أعرف كل ملفاتك وروابطك ومجلداتك ووسومها. اسألني: أين أجد...؟ أو اجمع لي كل الملفات عن...", "en": "I know all your files, links, folders and tags. Ask me: where can I find...? or gather all files about..."}});
Object.assign(D,{"chat_working": {"ar": "جارٍ تنظيم المكتبة...", "en": "Organizing the library..."}, "sum_added": {"ar": "أُضيف {n} رابط", "en": "Added {n} links"}, "sum_moved": {"ar": "نُقل {n} عنصر", "en": "Moved {n} items"}, "sum_fail": {"ar": "تعذّر تنفيذ {n} عملية", "en": "{n} actions failed"}, "sum_exists": {"ar": "موجود مسبقاً في المكتبة: {n}", "en": "Already in the library: {n}"}, "sum_dead": {"ar": "روابط لا تعمل (تم تخطيها): {n}", "en": "Dead links skipped: {n}"}, "sum_over": {"ar": "زائد عن الحد (أرسلها مرة أخرى): {n}", "en": "Over the limit, send them again: {n}"}, "isnew": {"ar": "جديد", "en": "new"}, "chat_undo": {"ar": "تراجع عن هذه العملية", "en": "Undo this"}, "chat_undone": {"ar": "تم التراجع.", "en": "Undone."}, "chat_s4": {"ar": "نظّم العناصر غير المصنّفة", "en": "Organize unfiled items"}, "chat_hello": {"ar": "أعرف كل ملفاتك وروابطك. اسألني: أين أجد...؟ الصق لي مجموعة روابط وسأحللها وأضعها في المجلدات المناسبة، أو قل: نظّم العناصر غير المصنّفة.", "en": "I know all your files and links. Ask me where something is, paste a bunch of links and I will analyze them and file them in the right folders, or say: organize the unfiled items."}});
const chat=[];let chatBusy=false,aiSet=null,chatStatus='';
const cmd=x=>esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
function drawChat(){const m=$('cmsgs');
  const row=id=>{const i=items.find(x=>x.id===id);if(!i)return '';const k=kind(i),href=i.type==='link'?i.url:i.fileUrl,f=folders.find(x=>x.id===i.folder);return `<a class="ri" href="${esc(href)}" target="_blank" rel="noopener"><i class="dot" style="background:${k.c}"></i><span class="t">${esc(i.title)}</span><small>${esc(f?f.name:tx('nofolder'))}</small></a>`};
  m.innerHTML=(chat.length?'':`<div class="ba">${esc(tx('chat_hello'))}</div>`)+chat.map((x,n)=>{
    if(x.role==='user')return `<div class="bu">${esc(x.content)}</div>`;
    const ids=(x.ids||[]).filter(id=>items.some(i=>i.id===id));
    return `<div class="ba${x.err?' er':''}">${cmd(x.content)}${ids.slice(0,8).map(row).join('')}${ids.length>8?`<small style="display:block;margin-top:6px">+${ids.length-8}</small>`:''}${ids.length>1?`<button class="btn" data-cshow="${n}" style="min-height:38px;margin-top:8px;width:100%">${esc(tx('chat_show',{n:ids.length}))}</button>`:''}${x.undo&&!x.undo.done?`<button class="btn" data-undo="${n}" style="min-height:38px;margin-top:8px;width:100%">${esc(tx('chat_undo'))}</button>`:''}</div>`}).join('')
    +(chatBusy?`<div class="ba"><span class="dots"><i></i><i></i><i></i></span>${chatStatus?' '+esc(chatStatus):''}</div>`:'');
  m.scrollTop=m.scrollHeight}
const pool=async(arr,n,fn)=>{let i=0;await Promise.all(Array.from({length:Math.min(n,arr.length)},async()=>{while(i<arr.length)await fn(arr[i++])}))};
const nrm=x=>String(x).toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');
async function applyPlan(plan){
  const ops=[],meta=[],prev={};
  for(const nf of plan.newFolders||[]){ops.push({a:'addFolder',name:nf.name,ref:nf.ref,reuse:true});meta.push({})}
  for(const l of plan.links||[]){ops.push({a:'addLink',url:l.url,title:l.title,folder:l.folderId||'',folderRef:l.folderRef,by:by(),thumb:l.thumb||'',tags:l.tags});meta.push({title:l.title})}
  for(const m of plan.moves||[]){const it=items.find(x=>x.id===m.id);if(!it)continue;prev[m.id]=it.folder||'';ops.push(m.folderRef?{a:'updateItem',id:m.id,folderRef:m.folderRef}:{a:'updateItem',id:m.id,folder:m.folderId||''});meta.push({title:it.title})}
  chatStatus=tx('chat_working');drawChat();
  const j=await api({action:'batch',ops}),R=j.results||[],undo={items:[],folders:[],moved:[],done:false},by_={},added=[],moved=[],refId={},fresh=new Set();let fail=0;
  ops.forEach((op,i)=>{const r=R[i]||{};if(r.error){fail++;return}if(op.a==='addFolder'){refId[op.ref]=r.id;if(!r.existed){undo.folders.push(r.id);fresh.add(r.id)}}});
  const fname=id=>(folders.find(f=>f.id===id)||{}).name||tx('nofolder');
  const note=(fid,title)=>{const n=fname(fid||''),o=by_[n]||(by_[n]={nw:false,t:[]});if(fresh.has(fid))o.nw=true;o.t.push(title)};
  ops.forEach((op,i)=>{const r=R[i]||{};if(r.error)return;const fid=op.folderRef?refId[op.folderRef]:op.folder;
    if(op.a==='addLink'){undo.items.push(r.id);added.push(r.id);note(fid,meta[i].title)}
    if(op.a==='updateItem'){undo.moved.push({id:op.id,prev:prev[op.id]});moved.push(op.id);note(fid,meta[i].title)}});
  const L=[];if(added.length)L.push(tx('sum_added',{n:added.length}));if(moved.length)L.push(tx('sum_moved',{n:moved.length}));
  for(const [n,o] of Object.entries(by_))L.push(`**${n}**${o.nw?' ('+tx('isnew')+')':''}: ${o.t.slice(0,5).join(', ')}${o.t.length>5?' +'+(o.t.length-5):''}`);
  if(fail)L.push(tx('sum_fail',{n:fail}));
  return{extra:L.join('\n'),ids:[...added,...moved],undo}}
const skipLines=sk=>{const c=w=>sk.filter(x=>x.why===w).length;return [c('exists')&&tx('sum_exists',{n:c('exists')}),c('dead')&&tx('sum_dead',{n:c('dead')}),c('over')&&tx('sum_over',{n:c('over')})].filter(Boolean).join('\n')};
async function undoPlan(n){const m=chat[n],u=m&&m.undo;if(!u||u.done)return;u.done=true;drawChat();
  const ops=[...u.moved.map(x=>({a:'updateItem',id:x.id,folder:x.prev})),...u.items.map(id=>({a:'deleteItem',id})),...u.folders.map(id=>({a:'deleteFolder',id}))];
  try{if(ops.length)await api({action:'batch',ops})}catch(e){}
  m.content+='\n'+tx('chat_undone');m.ids=[];drawChat()}
async function sendChat(text){text=(text||$('cinp').value).trim();if(!text||chatBusy)return;$('cinp').value='';chat.push({role:'user',content:text});chatBusy=true;chatStatus='';drawChat();
  try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:chat.slice(-12).map(m=>({role:m.role,content:m.content})),lang:LG})});
    const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'HTTP '+r.status);
    const msg={role:'assistant',content:j.answer||'',ids:j.ids||[]},p=j.plan;
    if(p&&((p.links||[]).length||(p.moves||[]).length)){chatStatus=tx('chat_working');drawChat();const a=await applyPlan(p);msg.content=[msg.content,a.extra].filter(Boolean).join('\n');msg.ids=a.ids;msg.undo=a.undo}
    if(j.skipped&&j.skipped.length)msg.content=[msg.content,skipLines(j.skipped)].filter(Boolean).join('\n');
    chat.push(msg)}
  catch(e){chat.push({role:'assistant',content:tx('chat_fail')+' — '+e.message,err:1,ids:[]})}
  chatBusy=false;chatStatus='';drawChat()}
