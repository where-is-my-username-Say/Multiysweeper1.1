<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مكتبة المشروع</title>
<style>
:root{--bg:#F1F3F7;--card:#fff;--tx:#0B1D3A;--mut:#64708a;--bd:#dde2ec;--pri:#2D6CDF;--acc:#FF6B2C;--dang:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#0d1526;--card:#16213a;--tx:#e8edf7;--mut:#93a0ba;--bd:#27345a;--pri:#5b92f0;--acc:#ff8a57;--dang:#ef6a6a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,Roboto,"Segoe UI",Tahoma,sans-serif;font-size:15px}
header{background:#0B1D3A;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}
header input{width:130px;min-height:34px;background:#ffffff18;border-color:#ffffff30;color:#fff}
header input::placeholder{color:#ffffff90}
main{display:flex;gap:14px;padding:14px;max-width:1100px;margin:auto;align-items:flex-start}
aside{width:230px;flex:none;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
section{flex:1;min-width:0}
button,input,select{font:inherit;color:inherit}
button{min-height:40px;border-radius:9px;border:1px solid var(--bd);background:var(--card);padding:0 12px;cursor:pointer}
button.p{background:var(--pri);border-color:var(--pri);color:#fff}
button.a{background:var(--acc);border-color:var(--acc);color:#fff}
button.d{color:var(--dang)}
input,select{min-height:40px;border:1px solid var(--bd);border-radius:9px;padding:0 10px;background:var(--card);width:100%}
.f{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:9px;cursor:pointer}
.f:hover{background:var(--bg)}.f.on{background:var(--pri);color:#fff}
.f .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f .c{font-size:12px;opacity:.75}
.f button{display:none;min-height:28px;padding:0 6px;font-size:12px}.f:hover button{display:inline-block}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar input{flex:1;min-width:150px}
.drop{border:2px dashed var(--bd);border-radius:12px;padding:14px;text-align:center;color:var(--mut);margin-bottom:12px}
.drop.over{border-color:var(--acc);background:rgba(255,107,44,.08)}
.it{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.ty{flex:none;width:46px;text-align:center;font-size:11px;font-weight:700;padding:6px 0;border-radius:8px;background:var(--bg);color:var(--mut)}
.bd{flex:1;min-width:0}
.bd a{color:var(--pri);font-weight:600;text-decoration:none;word-break:break-word}
.meta{font-size:12px;color:var(--mut);margin-top:3px}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.acts select{width:auto;min-height:36px}.acts button{min-height:36px}
.empty{text-align:center;color:var(--mut);padding:30px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--bg);margin-inline-start:6px}
#m{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#m.on{display:flex}
#m .box{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:420px;display:grid;gap:10px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#0B1D3A;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:10}
@media(max-width:720px){main{flex-direction:column}aside{width:100%}.it{flex-wrap:wrap}.acts{width:100%;justify-content:flex-start}}
</style>
</head>
<body>
<header><h1>مكتبة المشروع</h1><input id="me" placeholder="اسمك" maxlength="30"></header>
<main>
<aside>
  <div id="fl"></div>
  <button class="p" style="width:100%;margin-top:8px" id="nf">مجلد جديد</button>
</aside>
<section>
  <div class="bar"><input id="q" placeholder="بحث..."><button class="a" id="al">إضافة رابط</button></div>
  <div class="drop" id="dz">اسحب الملفات هنا أو <button id="pick">اختر ملفات</button><input id="fi" type="file" multiple hidden></div>
  <div id="ls"></div>
</section>
</main>
<div id="m"><div class="box" id="mb"></div></div>
<div id="toast"></div>
<script type="module">
const $=id=>document.getElementById(id);
let folders=[],items=[],cur='all',q='',last='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let busy=0;
function toast(t,ms=2600){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms)}
const fmt=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
const kind=i=>{if(i.type==='link')return'رابط';const t=i.contentType||'';return t.includes('pdf')?'PDF':t.startsWith('image/')?'صورة':t.includes('sheet')||t.includes('csv')?'جدول':'ملف'};
const by=()=>{try{return localStorage.getItem('me')||''}catch(e){return ''}};
$('me').value=by();$('me').onchange=e=>{try{localStorage.setItem('me',e.target.value.trim())}catch(_){}};

async function api(body){
  const r=await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'خطأ');return j;
}
async function act(body){try{await api(body)}catch(e){toast('تعذّر تنفيذ العملية — '+e.message,9000)}await refresh(true)}
async function refresh(force){
  try{const d=await api({action:'list'});const s=JSON.stringify(d);if(s===last&&!force)return;last=s;
    folders=d.folders.sort((a,b)=>(a.at||0)-(b.at||0));items=d.items;render()}catch(e){}
}
function ask(title,fields){return new Promise(res=>{busy++;
  const b=$('mb');b.innerHTML='<b>'+esc(title)+'</b>'+fields.map((f,i)=>f.opts?`<select data-i="${i}">${f.opts.map(o=>`<option value="${esc(o[0])}" ${o[0]===f.v?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:`<input data-i="${i}" placeholder="${esc(f.ph||'')}" value="${esc(f.v||'')}">`).join('')+'<div style="display:flex;gap:8px"><button class="p" id="ok" style="flex:1">حفظ</button><button id="no">إلغاء</button></div>';
  $('m').classList.add('on');const ins=b.querySelectorAll('[data-i]');ins[0].focus();
  const done=v=>{busy--;$('m').classList.remove('on');res(v)};
  $('ok').onclick=()=>done([...ins].map(x=>x.value.trim()));$('no').onclick=()=>done(null);
  ins[ins.length-1].onkeydown=e=>{if(e.key==='Enter')$('ok').click()};
})}
const folderOpts=()=>[['','غير مصنّف'],...folders.map(f=>[f.id,f.name])];
function render(){
  const cnt=id=>items.filter(i=>(i.folder||'')===id).length;
  const row=(id,name,c,ed)=>`<div class="f ${cur===id?'on':''}" data-f="${esc(id)}"><span class="n">${esc(name)}</span><span class="c">${c}</span>${ed?`<button data-ren="${esc(id)}">تسمية</button><button class="d" data-del="${esc(id)}">حذف</button>`:''}</div>`;
  $('fl').innerHTML=row('all','الكل',items.length)+row('','غير مصنّف',cnt(''))+folders.map(f=>row(f.id,f.name,cnt(f.id),true)).join('');
  let list=items.filter(i=>cur==='all'||(i.folder||'')===cur);
  if(q){const s=q.toLowerCase();list=list.filter(i=>(i.title+' '+(i.url||'')).toLowerCase().includes(s))}
  list.sort((a,b)=>(b.at||0)-(a.at||0));
  $('ls').innerHTML=list.length?list.map(i=>{
    const href=i.type==='link'?i.url:i.fileUrl;const fn=(folders.find(f=>f.id===i.folder)||{}).name;
    return `<div class="it"><div class="ty">${kind(i)}</div><div class="bd"><a href="${esc(href)}" target="_blank" rel="noopener">${esc(i.title)}</a>${fn&&cur==='all'?`<span class="tag">${esc(fn)}</span>`:''}
    <div class="meta">${i.type==='file'?fmt(i.size||0)+' · ':''}${esc(i.by||'')} · ${new Date(i.at||0).toLocaleDateString('ar')}</div></div>
    <div class="acts"><select data-mv="${esc(i.id)}">${folderOpts().map(o=>`<option value="${esc(o[0])}" ${o[0]===(i.folder||'')?'selected':''}>${esc(o[1])}</option>`).join('')}</select>
    <button data-rn="${esc(i.id)}">تسمية</button><button class="d" data-rm="${esc(i.id)}">حذف</button></div></div>`}).join(''):'<div class="empty">لا يوجد شيء هنا بعد</div>';
}
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,.f');if(!t)return;const d=t.dataset;
  if(d.ren!==undefined){e.stopPropagation();const f=folders.find(x=>x.id===d.ren);const r=await ask('اسم المجلد',[{v:f.name}]);if(r&&r[0])act({action:'renameFolder',id:f.id,name:r[0]});return}
  if(d.del!==undefined){e.stopPropagation();const f=folders.find(x=>x.id===d.del);if(!confirm('حذف المجلد «'+f.name+'»؟ ستنتقل عناصره إلى «غير مصنّف».'))return;if(cur===f.id)cur='all';act({action:'deleteFolder',id:f.id});return}
  if(d.f!==undefined){cur=d.f;render();return}
  if(d.rn){const i=items.find(x=>x.id===d.rn);const r=await ask('اسم العنصر',[{v:i.title}]);if(r&&r[0])act({action:'updateItem',id:i.id,title:r[0]});return}
  if(d.rm){const i=items.find(x=>x.id===d.rm);if(confirm('حذف «'+i.title+'» للجميع؟'))act({action:'deleteItem',id:i.id})}
});
document.addEventListener('change',e=>{const s=e.target.closest('[data-mv]');if(s)act({action:'updateItem',id:s.dataset.mv,folder:s.value})});
$('q').oninput=e=>{q=e.target.value.trim();render()};
$('nf').onclick=async()=>{const r=await ask('مجلد جديد',[{ph:'اسم المجلد'}]);if(r&&r[0])act({action:'addFolder',name:r[0]})};
$('al').onclick=async()=>{
  const r=await ask('إضافة رابط',[{ph:'https://...'},{ph:'اسم الرابط (اختياري)'},{opts:folderOpts(),v:cur==='all'?'':cur}]);
  if(!r||!r[0])return;let u=r[0];if(!/^https?:\/\//i.test(u))u='https://'+u;
  act({action:'addLink',url:u,title:r[1]||u.replace(/^https?:\/\//,'').slice(0,60),folder:r[2]||'',by:by()});
};
async function uploadFiles(fs){
  const dest=cur==='all'?'':cur;busy++;
  for(const f of fs){
    try{
      if(f.size>4.4e6){toast('الملف «'+f.name+'» أكبر من 4 MB (الحد الأقصى)',6000);continue}
      toast('جارٍ رفع '+f.name);
      const r=await fetch('/api/upload?name='+encodeURIComponent(f.name)+'&type='+encodeURIComponent(f.type||'application/octet-stream'),{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:f});
      const j=await r.json().catch(()=>({error:'HTTP '+r.status}));
      if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
      await api({action:'addFile',fileUrl:j.url,title:f.name,size:f.size,contentType:f.type,folder:dest,by:by()});
      toast('تم رفع '+f.name);
    }catch(e){toast('تعذّر رفع '+f.name+' — '+String((e&&e.message)||e).slice(0,160),9000)}
  }
  busy--;refresh(true);
}
$('pick').onclick=()=>$('fi').click();$('fi').onchange=e=>{uploadFiles([...e.target.files]);e.target.value=''};
const dz=$('dz');['dragenter','dragover'].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.add('over')}));
['dragleave','drop'].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.remove('over')}));
dz.addEventListener('drop',e=>uploadFiles([...e.dataTransfer.files]));
render();refresh(true);
setInterval(()=>{if(!busy&&!document.hidden)refresh()},5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!busy)refresh()});
</script>
</body>
</html>
